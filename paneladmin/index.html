<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin</title>
  <style>
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: #0b0b0f;
      color: #eaeaf0;
    }

    .wrap {
      max-width: 1080px;
      margin: 24px auto;
      padding: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      background: #14141b;
      border: 1px solid #23232f;
      border-radius: 14px;
      padding: 16px;
    }

    .title {
      font-size: 20px;
      margin: 0 0 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    input,
    textarea,
    select,
    button {
      background: #0f0f15;
      color: #eaeaf0;
      border: 1px solid #2a2a37;
      border-radius: 10px;
      padding: 8px 10px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }

    input[type="file"] {
      padding: 6px;
    }

    button {
      cursor: pointer;
    }

    .success {
      color: #4ade80;
    }

    .danger {
      color: #f87171;
    }

    pre {
      background: #0f0f15;
      border: 1px solid #2a2a37;
      padding: 12px;
      border-radius: 10px;
      overflow: auto;
      max-height: 400px;
    }

    .muted {
      color: #9aa0aa;
      font-size: 12px;
    }

    .kvs {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 8px;
      align-items: center;
    }

    hr {
      border: none;
      border-top: 1px solid #23232f;
      margin: 12px 0;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
